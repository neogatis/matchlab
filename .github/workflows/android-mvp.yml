name: android-mvp

concurrency:
  group: matchlab-android-debug-signing
  cancel-in-progress: false

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-mvp.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-mvp.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: matchlab-android-debug-keystore-v3-stable

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --no-daemon

      - name: Print signing SHA-1
        run: gradle -p android :app:signingReport --no-daemon

      - name: Verify APK signatures
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: matchlab-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
