name: phase12-safety

on:
  push:
    branches: [phase12-safety]
  pull_request:
    branches: [main]
    paths:
      - "app/safety/**"
      - "app/auth/**"
      - "app/chat/**"
      - "app/matching/**"
      - "app/db/**"
      - "alembic/**"
      - "tests/test_safety_service.py"
      - ".github/workflows/phase12-safety.yml"

jobs:
  safety:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: matchlab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d matchlab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/matchlab

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-photo.txt

      - name: Upgrade database
        run: alembic upgrade head

      - name: Verify no schema drift
        run: alembic check

      - name: Run safety tests
        run: python -m unittest tests.test_safety_service -v

      - name: Run matching regression
        run: python -m unittest tests.test_matching_engine_v1 -v

      - name: Run chat regression
        run: python -m unittest tests.test_chat_service -v

      - name: Run auth regression
        run: python -m unittest tests.test_auth_service -v

      - name: Verify full rollback and re-upgrade
        run: |
          alembic downgrade base
          alembic upgrade head
