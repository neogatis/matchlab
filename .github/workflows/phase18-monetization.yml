name: phase18-monetization

on:
  push:
    branches: [phase18-monetization]
  pull_request:
    branches: [main]
    paths:
      - "app/billing/**"
      - "app/db/**"
      - "alembic/**"
      - "tests/test_billing_service.py"
      - ".github/workflows/phase18-monetization.yml"

jobs:
  billing:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: matchlab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d matchlab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/matchlab

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-auth.txt
      - run: alembic upgrade head
      - run: alembic check
      - run: python -m unittest tests.test_billing_service -v
      - run: python -m unittest tests.test_analytics_service -v
      - run: |
          alembic downgrade base
          alembic upgrade head
