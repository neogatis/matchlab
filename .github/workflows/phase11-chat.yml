name: phase11-chat

on:
  push:
    branches: [phase11-chat]
  pull_request:
    branches: [main]
    paths:
      - "app/chat/**"
      - "app/db/**"
      - "alembic/**"
      - "tests/test_chat_service.py"
      - ".github/workflows/phase11-chat.yml"

jobs:
  chat:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: matchlab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d matchlab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/matchlab

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-auth.txt

      - name: Upgrade database
        run: alembic upgrade head

      - name: Verify no schema drift
        run: alembic check

      - name: Run chat tests
        run: python -m unittest tests.test_chat_service -v

      - name: Run interest regression
        run: python -m unittest tests.test_interest_service -v

      - name: Verify full rollback and re-upgrade
        run: |
          alembic downgrade base
          alembic upgrade head
