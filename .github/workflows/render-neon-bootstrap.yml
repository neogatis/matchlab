name: render-neon-bootstrap

on:
  push:
    branches: [infra-neon-bootstrap]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install migration dependencies
        run: pip install -r requirements-auth.txt

      - name: Render exact bootstrap SQL from Alembic
        run: |
          mkdir -p database
          alembic upgrade head --sql > database/bootstrap.sql
          test -s database/bootstrap.sql
          grep -q "alembic_version" database/bootstrap.sql
          grep -q "auth_challenges" database/bootstrap.sql
          grep -q "questionnaire_questions" database/bootstrap.sql

      - name: Commit rendered bootstrap SQL
        run: |
          if git diff --quiet -- database/bootstrap.sql && git ls-files --error-unmatch database/bootstrap.sql >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/bootstrap.sql
          git commit -m "Infra: freeze rendered Neon bootstrap SQL"
          git push
