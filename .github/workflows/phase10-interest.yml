name: phase10-interest

on:
  push:
    branches: [phase10-interest]
  pull_request:
    branches: [main]
    paths:
      - "app/interests/**"
      - "app/matching/**"
      - "app/db/**"
      - "alembic/**"
      - "scripts/import_v7_sqlite_to_postgres.py"
      - "scripts/compare_v7_sqlite_postgres.py"
      - "tests/test_interest_service.py"
      - "tests/test_matching_engine_v1.py"
      - "tests/test_postgres_migration.py"
      - ".github/workflows/phase10-interest.yml"

permissions:
  contents: write

jobs:
  interest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: matchlab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d matchlab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/matchlab

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-photo.txt

      - name: Upgrade committed migrations
        run: alembic upgrade head

      - name: Generate Phase 10 migration when needed
        id: migration
        shell: bash
        run: |
          set +e
          alembic check >/tmp/alembic-check.txt 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "generated=false" >> "$GITHUB_OUTPUT"
          else
            cat /tmp/alembic-check.txt
            alembic revision --autogenerate -m "phase10 interest decisions"
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply Phase 10 schema
        run: alembic upgrade head

      - name: Run interest tests
        run: python -m unittest tests.test_interest_service -v

      - name: Run matching regression
        run: python -m unittest tests.test_matching_engine_v1 -v

      - name: Rehearse v7 import
        run: python -m unittest tests.test_postgres_migration -v

      - name: Verify no schema drift
        run: alembic check

      - name: Verify full rollback and re-upgrade
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Commit generated migration
        if: github.event_name == 'push' && steps.migration.outputs.generated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alembic/versions/*.py
          git commit -m "Phase 10: freeze interest decision migration"
          git push
