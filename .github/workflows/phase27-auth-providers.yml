name: phase27-auth-providers

on:
  push:
    paths:
      - "app/auth/**"
      - "app/http/**"
      - "tests/test_auth_multichannel.py"
      - "tests/test_auth_service.py"
      - "requirements-auth.txt"
      - ".env.example"
      - ".github/workflows/phase27-auth-providers.yml"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: matchlab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d matchlab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/matchlab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-photo.txt
      - run: alembic upgrade head
      - run: python -m unittest tests.test_auth_service tests.test_auth_multichannel tests.test_http_runtime_contract tests.test_security_http -v
      - run: python -m py_compile app/auth/service.py app/auth/sms.py app/auth/oauth.py app/http/server.py
