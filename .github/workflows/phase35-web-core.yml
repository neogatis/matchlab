name: phase35-web-core

on:
  push:
    paths:
      - "web/**"
      - "app/http/**"
      - "app/chat/**"
      - "app/interests/**"
      - "app/matching/**"
      - ".github/workflows/phase35-web-core.yml"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: matchlab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d matchlab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/matchlab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements-push.txt
      - run: alembic upgrade head
      - run: python -m py_compile app/http/server.py app/chat/service.py app/interests/service.py app/matching/service.py
      - run: node --check web/app.js
      - run: >
          python -m unittest
          tests.test_matching_engine_v1
          tests.test_interest_service
          tests.test_chat_service
          tests.test_http_runtime_contract
          -v
